# Cloudflare Worker：表單提交防護代理（Turnstile + 限流 + 內容檢查 → 轉發 Apps Script）
# 部署見 worker-submit/README.md。database_id 由 `wrangler d1 create tn-submit` 產生後填入。
# 機密（TURNSTILE_SECRET / APPS_SCRIPT_URL / APPS_SCRIPT_SECRET / SALT）用 `wrangler secret put`，不寫這裡。
name = "tn-submit"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "tn-submit"
database_id = "c390a55b-1dfa-4118-ad14-da687c6e5c0f"

# 每日清限流舊列（見 src/index.js 的 scheduled）。20:00 UTC = 台北隔日 04:00。
[triggers]
crons = ["0 20 * * *"]
