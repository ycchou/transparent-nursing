# Cloudflare Worker：首頁匿名訪客計數（今日 / 累計）
# 部署見 worker/README.md。database_id 由 `wrangler d1 create tn-visits` 產生後填入。
name = "tn-visits"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "tn-visits"
database_id = "295f6b9a-4c85-49b2-b3c5-93cbf597c681"

# 每日清理 seen 去重舊列（見 src/index.js 的 scheduled）。
# 20:00 UTC = 台北隔日 04:00，午夜換日後才清，保留今天+昨天。
[triggers]
crons = ["0 20 * * *"]
