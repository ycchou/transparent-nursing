name: Auto update data

# 每 5 天自動更新可全自動取得的官方資料（tools/update-data.py）：
#   · 人力監控 PDF（衛福部，新月份）       · 病床設施（衛福部，各院區登記床數＋背景歷史快照）
#   · 違規名稱對照（重讀線上 Sheet）        · 護病比開放資料／財務新年度（只檢查，有新資料會在摘要提示）
# 有變動才 commit、push，並觸發部署（部署成功後推播照常送出）。
# 三班護病比新月份（健保署主站有機器人驗證）與財務年度報表 ODS 仍需手動下載後在本機跑 update-data.py。
on:
  schedule:
    - cron: '0 19 */5 * *'   # UTC 19:00＝台灣 03:00；每月 1、6、11、16、21、26、31 日（UTC）
  workflow_dispatch:

permissions:
  contents: write   # commit、push 資料
  actions: write    # 觸發部署 workflow

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: 安裝解析相依套件（pdfplumber、odfpy、pandas）
        run: pip install -r tests/requirements.txt

      # 人力監控逐檔 PDF 解析快取：沒有的話新月份一來就得重解全部 PDF（約 14 分鐘）
      - name: 還原建置快取
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: build-cache-${{ github.run_id }}
          restore-keys: build-cache-

      # repo 裡的產物就是目前輸入建出來的：先記為已建置，之後只重跑這次抓到新資料的步驟
      - name: 以 repo 現況為建置基準
        run: python tools/build-all.py --mark

      - name: 更新資料並 commit
        id: update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          python tools/update-data.py --commit
          if [ "$(git rev-parse HEAD)" != "$before" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Push
        if: steps.update.outputs.changed == 'true'
        run: |
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      # GITHUB_TOKEN 的 push 不會觸發其他 workflow，所以明確觸發部署
      - name: 觸發部署
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
