name: Deploy to GitHub Pages

# push 到 main（或手動觸發）：先檢查，全部通過才部署。
# Pull Request：只跑檢查，不部署。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 部署 Pages 所需的最小權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署；新的 push 進來就取消還在進行的舊部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 部署前檢查：本機建置流程的產物必須與原始碼一致，資料結構必須正確。
  # 任一項失敗 → 不部署，正式站維持上一個好的版本。
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: css/styles.css 與 css/src/ 一致（沒有直接改 styles.css、改了 src 也有重建）
        run: python tools/build-css.py --check

      - name: 表單頁與 templates/ 一致
        run: python tools/build-forms.py --check

      - name: 資產 ?v= 版本號是最新的（避免使用者拿到舊快取）
        run: python tools/stamp-assets.py --check

      - name: 資料結構驗證
        run: python tools/validate-data.py

  # 資料解析器測試：固定的原始 PDF／ODS 解析結果必須與 tests/expected/ 相同
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: 安裝解析器相依套件
        run: pip install -r tests/requirements.txt

      - name: 解析器測試
        run: python -m unittest discover tests -v

  # 冒煙測試：用 headless Chrome 開「實際要部署的內容」的每一頁（手機＋桌機），
  # 確認沒有 JS 錯誤、沒有 404、外框與主要內容都有畫出來
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node（需 22+：內建 WebSocket）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 組出部署內容
        run: python tools/build-site.py _site

      - name: 冒煙測試
        run: node tools/smoke-test.mjs _site

  deploy:
    needs: [check, test, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 組出部署內容（只含網站會用到的檔案；原始 PDF／ODS、工具、Worker 原始碼不部署）
        run: python tools/build-site.py _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
